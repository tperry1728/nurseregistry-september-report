// ── SHARED ────────────────────────────────────────────────
function bdg(t){return t.badge==='hq'?`<span class="badge badge-hq">HQ</span>`:t.badge==='future'?`<span class="badge badge-future">Future hire</span>`:'';}
function ca9Block(total,ptHtml,listHtml,barColor){
  const pct=Math.round((total/Math.max(window._mv,1))*100);
  return `<hr class="divider"/><div class="t-card" style="border-color:var(--color-border-info,#93c5fd);background:var(--color-background-info-subtle,var(--color-background-secondary))">
    <div class="t-header"><div><span class="t-code">CA9</span><span class="t-name">All Other California Cities</span><span class="badge badge-ca9">Outside defined territories</span></div>
    <div style="text-align:right;white-space:nowrap"><span class="t-total">${total}</span><span class="t-label">sessions</span></div></div>
    <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
    ${ptHtml}
    <button class="ca9-toggle" onclick="const l=this.nextElementSibling;l.style.display=l.style.display==='flex'?'none':'flex';this.textContent=l.style.display==='flex'?'Hide cities ▲':'Show contributing cities ▼'">Show contributing cities ▼</button>
    <div class="ca9-list">${listHtml}</div>
  </div>`;
}
function switchTab(id){
  document.querySelectorAll('.report').forEach(r=>r.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['r1','r2','r3'][i]===id));
  document.getElementById(id).classList.add('active');
}

// ── REPORT 1 ──────────────────────────────────────────────
let r1sm='sessions';
function r1Sort(m){r1sm=m;document.querySelectorAll('#r1 .sort-btn').forEach((b,i)=>b.classList.toggle('active',['sessions','territory'][i]===m));renderR1();}
function renderR1(){
  const td=TERRITORIES.map(t=>({t,total:t.cities.reduce((s,c)=>s+(R1_ALL[c]||0),0)}));
  const ca9e=Object.entries(R1_ALL).filter(([c])=>!ALL_TC.has(c.toLowerCase()));
  const ca9t=ca9e.reduce((s,[,v])=>s+v,0);
  const mx=Math.max(...td.map(d=>d.total),ca9t,1);window._mv=mx;
  const sorted=[...td].sort((a,b)=>r1sm==='sessions'?b.total-a.total:a.t.code.localeCompare(b.t.code));
  const cards=sorted.map(({t,total})=>{
    const pct=Math.round((total/mx)*100);
    const pills=t.cities.map(c=>{const s=R1_ALL[c]||0;return `<span class="pill ${s>0?'on':'off'}">${c}${s>0?' · '+s:''}</span>`;}).join('');
    return `<div class="t-card"><div class="t-header"><div><span class="t-code">${t.code}</span><span class="t-name">${t.name}</span>${bdg(t)}</div><div style="text-align:right;white-space:nowrap"><span class="t-total">${total}</span><span class="t-label">sessions</span></div></div><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pill-row">${pills}</div></div>`;
  }).join('');
  const ca9pills=ca9e.sort((a,b)=>b[1]-a[1]).slice(0,60).map(([c,s])=>`<span class="pill on">${c} · ${s}</span>`).join('');
  const tTotal=td.reduce((s,d)=>s+d.total,0);const grand=tTotal+ca9t;
  document.getElementById('r1sum').innerHTML=`<div class="sc"><p class="sl">Total CA sessions</p><p class="sv">${grand.toLocaleString()}</p></div><div class="sc"><p class="sl">Territory sessions</p><p class="sv">${tTotal} <span style="font-size:12px;color:var(--color-text-tertiary)">${Math.round(tTotal/grand*100)}%</span></p></div><div class="sc"><p class="sl">CA9 other cities</p><p class="sv">${ca9t.toLocaleString()} <span style="font-size:12px;color:var(--color-text-tertiary)">${Math.round(ca9t/grand*100)}%</span></p></div><div class="sc"><p class="sl">Data period</p><p class="sv">Sep 2026</p></div>`;
  document.getElementById('r1cards').innerHTML=cards+ca9Block(ca9t,'',ca9pills,'#3266ad');
}

// ── REPORT 2 ──────────────────────────────────────────────
let r2fm='all',r2sm='sessions';
function r2Filter(f){r2fm=f;document.querySelectorAll('#r2 .fbtn').forEach((b,i)=>b.classList.toggle('active',['all','stroke','postsurg','medication','concierge'][i]===f));renderR2();}
function r2Sort(m){r2sm=m;document.querySelectorAll('#r2 .sort-btn').forEach((b,i)=>b.classList.toggle('active',['sessions','territory'][i]===m));renderR2();}
function ct(c,f){return f==='all'?Object.values(c).reduce((a,b)=>a+b,0):c[f]||0;}
function gtc(cities){const t={stroke:0,postsurg:0,medication:0,concierge:0};cities.forEach(c=>{const d=condMap[c];if(d)Object.keys(t).forEach(k=>t[k]+=d[k]||0);});return t;}
function cpills(conds,f){return Object.entries(COND_COLORS).map(([k,col])=>{const v=conds[k]||0;const dim=f!=='all'&&f!==k;return `<div class="cpill" style="opacity:${dim?0.25:v===0?0.3:1}"><span class="cdot" style="background:${col}"></span><span class="cval">${v}</span><span class="cname">${COND_LABELS[k]}</span></div>`;}).join('');}
function renderR2(){
  const td=TERRITORIES.map(t=>({t,conds:gtc(t.cities)}));
  const ca9c={stroke:0,postsurg:0,medication:0,concierge:0};
  Object.entries(condMap).forEach(([c,d])=>{if(!ALL_TC.has(c.toLowerCase()))Object.keys(ca9c).forEach(k=>ca9c[k]+=d[k]||0);});
  const ca9t=ct(ca9c,r2fm);
  const mx=Math.max(...td.map(({conds})=>ct(conds,r2fm)),ca9t,1);window._mv=mx;
  const bc=r2fm==='all'?'#3266ad':r2fm==='stroke'?'#3266ad':r2fm==='postsurg'?'#1d9e75':r2fm==='medication'?'#e07b39':'#9b59b6';
  const sorted=[...td].sort((a,b)=>r2sm==='sessions'?ct(b.conds,r2fm)-ct(a.conds,r2fm):a.t.code.localeCompare(b.t.code));
  const cards=sorted.map(({t,conds})=>{
    const total=ct(conds,r2fm);const pct=Math.round((total/mx)*100);
    return `<div class="t-card"><div class="t-header"><div><span class="t-code">${t.code}</span><span class="t-name">${t.name}</span>${bdg(t)}</div><div style="text-align:right;white-space:nowrap"><span class="t-total">${total}</span><span class="t-label">sessions</span></div></div><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${bc}"></div></div><div class="pill-row">${cpills(conds,r2fm)}</div></div>`;
  }).join('');
  const ca9cities=Object.entries(condMap).filter(([c])=>!ALL_TC.has(c.toLowerCase())&&ct(condMap[c],r2fm)>0).sort((a,b)=>ct(b[1],r2fm)-ct(a[1],r2fm));
  const ca9pills=ca9cities.map(([c,d])=>`<span class="pill on">${c} · ${ct(d,r2fm)}</span>`).join('');
  const ac={stroke:0,postsurg:0,medication:0,concierge:0};
  td.forEach(({conds})=>Object.keys(ac).forEach(k=>ac[k]+=conds[k]||0));
  Object.keys(ac).forEach(k=>ac[k]+=ca9c[k]||0);
  const grand=Object.values(ac).reduce((a,b)=>a+b,0);
  document.getElementById('r2sum').innerHTML=`<div class="sc"><p class="sl">Total condition sessions</p><p class="sv">${grand}</p></div><div class="sc"><p class="sl">Post-Surgical</p><p class="sv">${ac.postsurg}</p></div><div class="sc"><p class="sl">Medication Mgmt</p><p class="sv">${ac.medication}</p></div><div class="sc"><p class="sl">Stroke Care</p><p class="sv">${ac.stroke}</p></div><div class="sc"><p class="sl">Concierge</p><p class="sv">${ac.concierge}</p></div>`;
  document.getElementById('r2cards').innerHTML=cards+ca9Block(ca9t,cpills(ca9c,r2fm),ca9pills,bc);
}

// ── REPORT 3 ──────────────────────────────────────────────
let r3fm='all',r3sm='sessions';
function r3Filter(f){r3fm=f;document.querySelectorAll('#r3 .fbtn').forEach((b,i)=>b.classList.toggle('active',['all','home','location','service','condition','pricing'][i]===f));renderR3();}
function r3Sort(m){r3sm=m;document.querySelectorAll('#r3 .sort-btn').forEach((b,i)=>b.classList.toggle('active',['sessions','territory'][i]===m));renderR3();}
function ptpills(bd,f){return Object.entries(PT_COLORS).map(([k,col])=>{const v=bd[k]||0;const dim=f!=='all'&&f!==k;return `<div class="cpill" style="opacity:${dim?0.25:v===0?0.3:1}"><span class="cdot" style="background:${col}"></span><span class="cval">${v}</span><span class="cname">${PT_LABELS[k]}</span></div>`;}).join('');}
function gtr3(cities,f){const bd={home:0,location:0,service:0,condition:0,pricing:0};let total=0;cities.forEach(c=>{const d=r3Map[c];if(!d)return;if(f==='all'){total+=d.total;Object.keys(bd).forEach(k=>bd[k]+=d[k]||0);}else{total+=d[f]||0;bd[f]=(bd[f]||0)+(d[f]||0);}});return{total,bd};}
function renderR3(){
  const td=TERRITORIES.map(t=>({t,...gtr3(t.cities,r3fm)}));
  let ca9t=0;const ca9bd={home:0,location:0,service:0,condition:0,pricing:0};
  Object.entries(r3Map).forEach(([c,d])=>{if(ALL_TC.has(c.toLowerCase()))return;if(r3fm==='all'){ca9t+=d.total;Object.keys(ca9bd).forEach(k=>ca9bd[k]+=d[k]||0);}else{ca9t+=d[r3fm]||0;ca9bd[r3fm]=(ca9bd[r3fm]||0)+(d[r3fm]||0);}});
  const mx=Math.max(...td.map(d=>d.total),ca9t,1);window._mv=mx;
  const bc=r3fm==='all'?'#3266ad':PT_COLORS[r3fm]||'#3266ad';
  const sorted=[...td].sort((a,b)=>r3sm==='sessions'?b.total-a.total:a.t.code.localeCompare(b.t.code));
  const cards=sorted.map(({t,total,bd})=>{
    const pct=Math.round((total/mx)*100);
    const pills=t.cities.map(c=>{const d=r3Map[c];const s=d?(r3fm==='all'?d.total:d[r3fm]||0):0;return `<span class="pill ${s>0?'on':'off'}">${c}${s>0?' · '+s:''}</span>`;}).join('');
    return `<div class="t-card"><div class="t-header"><div><span class="t-code">${t.code}</span><span class="t-name">${t.name}</span>${bdg(t)}</div><div style="text-align:right;white-space:nowrap"><span class="t-total">${total}</span><span class="t-label">sessions</span></div></div><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${bc}"></div></div><div class="pill-row" style="margin-bottom:6px">${ptpills(bd,r3fm)}</div><div class="pill-row">${pills}</div></div>`;
  }).join('');
  const ca9cities=Object.entries(r3Map).filter(([c])=>!ALL_TC.has(c.toLowerCase())&&(r3fm==='all'?r3Map[c].total:(r3Map[c][r3fm]||0))>0).sort((a,b)=>{const av=r3fm==='all'?a[1].total:a[1][r3fm]||0;const bv=r3fm==='all'?b[1].total:b[1][r3fm]||0;return bv-av;});
  const ca9pills=ca9cities.slice(0,60).map(([c,d])=>{const s=r3fm==='all'?d.total:d[r3fm]||0;return `<span class="pill on">${c} · ${s}</span>`;}).join('');
  const gbd={home:0,location:0,service:0,condition:0,pricing:0};let grand=0;
  [...td,{total:ca9t,bd:ca9bd}].forEach(({total,bd})=>{grand+=total;Object.keys(gbd).forEach(k=>gbd[k]+=bd[k]||0);});
  document.getElementById('r3sum').innerHTML=`<div class="sc"><p class="sl">Total /private-care/ sessions</p><p class="sv">${grand}</p></div><div class="sc"><p class="sl">Pricing</p><p class="sv">${gbd.pricing}</p></div><div class="sc"><p class="sl">Location pages</p><p class="sv">${gbd.location}</p></div><div class="sc"><p class="sl">Condition pages</p><p class="sv">${gbd.condition}</p></div><div class="sc"><p class="sl">Data period</p><p class="sv">Sep 2026</p></div>`;
  document.getElementById('r3cards').innerHTML=cards+ca9Block(ca9t,ptpills(ca9bd,r3fm),ca9pills,bc);
}

renderR1();renderR2();renderR3();
